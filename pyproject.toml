[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=80.9",
]

[project]
requires-python = ">= 3.12.3"
name = "sahc_lightning"
version = "2.0.2"
readme = "README.md"
license = { text = "sahc_lightning © 2026 by RSLab@DISI, UniTrento (Italy) is licensed under CC BY 4.0 " }
description = "Code package for the research project 'Semantics-Aware Hierarchical Consensus Learning for Remote Sensing Image Classification'"
authors = [
    { name = "Gianmarco Perantoni", email = "gianmarco.perantoni@unitn.it" },
    { name = "Giulio Weikmann", email = "giulio.weikmann@unitn.it" },
]
maintainers = [
    { name = "Gianmarco Perantoni", email = "gianmarco.perantoni@unitn.it" },
    { name = "Giulio Weikmann", email = "giulio.weikmann@unitn.it" },
]
dependencies = [
    "dask[array] == 2025.2.0",
    "einops == 0.8.1",
    "geopandas == 1.1.2",
    "lightning == 2.6.0",
    "numpy<2",
    "numcodecs == 0.13.1",
    "openpyxl == 3.1.5",
    "pandas == 2.3.3",
    "PyYAML == 6.0.3",
    "rasterio == 1.4.4",
    "rioxarray == 0.19.0",
    "scikit-learn == 1.6.1",
    "torchgeo == 0.8.0",
    "torchmetrics == 1.8.2",
    "xarray == 2026.1.0",
    "zarr == 2.18.7",
]

[project.optional-dependencies]
analysis = [
    "jupyter == 1.1.1",
    "matplotlib == 3.10.3",
    "seaborn == 0.13.2",
]
mlflow = ["mlflow == 3.8.1"]
tuning = [
    "optuna == 4.7.0",
    "ray == 2.53.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["hrlc_utils", "metrics", "mlflow_utils", "training"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.uv]
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'"
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 88
indent-width = 4

target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = true
docstring-code-line-length = "dynamic"
